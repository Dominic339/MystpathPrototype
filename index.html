<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mystpath</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f17; }
      #app { position: fixed; inset: 0; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 8px 12px; border-radius: 8px;
        background: rgba(10, 14, 22, 0.55); color: #e8ecf4; backdrop-filter: blur(6px);
        font: 13px/1.4 system-ui, -apple-system, sans-serif; pointer-events: none; user-select: none;
      }
      #hud b { font-weight: 600; }
      #toolbar {
        position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(100vw - 20px);
      }
      #toolbar button {
        font: 600 13px/1 system-ui, -apple-system, sans-serif; color: #e8ecf4; cursor: pointer;
        background: rgba(10, 14, 22, 0.6); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 18px;
        padding: 9px 13px; backdrop-filter: blur(6px); -webkit-tap-highlight-color: transparent;
      }
      #toolbar button.on { background: rgba(214, 168, 62, 0.85); color: #141413; border-color: transparent; }
      .card {
        position: fixed; color: #e8ecf4; background: rgba(10, 14, 22, 0.78); backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; padding: 12px 14px;
        font: 13px/1.45 system-ui, -apple-system, sans-serif; overflow-y: auto; display: none;
      }
      .card h3 { margin: 10px 0 4px; font-size: 14px; } .card h3:first-of-type { margin-top: 0; }
      .card h4 { margin: 8px 0 2px; font-size: 12px; color: #d6a83e; font-weight: 600; }
      .card ul { list-style: none; margin: 0; padding: 0; }
      .card li { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
      .card .quiet { color: #a8b3c7; }
      .card .close { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: #e8ecf4; font-size: 20px; cursor: pointer; }
      .card .person { padding: 6px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }
      .card .row { display: flex; justify-content: space-between; gap: 8px; }
      #panel { top: 12px; right: 12px; width: 320px; max-height: calc(100vh - 90px); }
      #hexcard { left: 12px; top: 90px; width: 250px; max-height: calc(100vh - 170px); }
      @media (max-width: 600px) {
        #panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 150px; max-height: 50vh; }
        #hexcard { left: 8px; right: 8px; width: auto; top: auto; bottom: 150px; max-height: 40vh; }
      }
      @media (max-width: 600px) { #hud { font-size: 11px; max-width: calc(100vw - 48px); } #toolbar button { padding: 8px 10px; font-size: 12px; } }
      #hud .quiet { color: #a8b3c7; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="toolbar"></div>
    <div id="panel" class="card"></div>
    <div id="hexcard" class="card"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
